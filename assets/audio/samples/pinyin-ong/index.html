<!doctype html><html lang="zh"><meta charset="utf-8"><title>ong 读音对比</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#fff8f1;color:#4b342e;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:760px;margin:0 auto;padding:26px 18px}h1{font-size:29px;margin:0 0 8px}p{color:#90726a;line-height:1.6}.chip{display:block;width:100%;text-align:left;border:1px solid #f0cdbf;background:#fff;border-radius:16px;padding:14px 16px;margin:10px 0;font:inherit;color:#4b342e;box-shadow:0 3px 0 #f0d8c9;cursor:pointer}.chip b{display:block;font-size:20px}.chip span{font-size:13px;color:#a47e70}.chip:active{transform:translateY(2px);box-shadow:none}#now{position:sticky;bottom:12px;background:#4b342e;color:#fff;border-radius:14px;padding:12px;text-align:center}</style><main><h1>ong 读音对比</h1><p>重点听：韵母 ong 不该读成 weng。先听「上一套纯 ong」，再听其他在 d/g 后面的 ong。</p><button class="chip" data-src="yoyo-weng1.mp3"><b>Yoyo 当前 wēng</b><span>wēng / 疑似把 ong 读成 weng</span></button><button class="chip" data-src="du-ong.mp3"><b>上一套纯 ong</b><span>du.hanyupinyin.cn</span></button><button class="chip" data-src="yoyo-dong1.mp3"><b>Yoyo dong</b><span>ong 在 d 后</span></button><button class="chip" data-src="studycli-dong1.mp3"><b>StudyCLI dong</b><span>ong 在 d 后</span></button><button class="chip" data-src="yoyo-gong1.mp3"><b>Yoyo gong</b><span>ong 在 g 后</span></button><button class="chip" data-src="studycli-gong1.mp3"><b>StudyCLI gong</b><span>ong 在 g 后</span></button><div id="now">点一条试听</div></main><script>const a=new Audio();document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{a.pause();a.src=x.dataset.src;a.play();document.querySelector('#now').textContent='正在播放：'+x.querySelector('b').textContent;});</script></html>
